<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chugpad</title>
<meta name="theme-color" content="#1a171e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#e7e8ec; --surface:#f4f4f7; --raised:#ffffff; --ink:#1c1a21; --dim:#67636f; --line:#aeabb8;
  --tick:rgba(20,16,30,.08); --beat:rgba(20,16,30,.045); --edge:#cfcdd8; --pm:#8a5a00; --on-acc:#ffffff;
  --t0:#c23d28; --t1:#a86a00; --t2:#12796d; --t3:#5b46cf; --danger:#b3261e;
  --rh:22px; --gut:20px; --acc:var(--t0);
  --ui:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a171e; --surface:#231f29; --raised:#2f2a37; --ink:#ece6da; --dim:#9b94a5; --line:#5f5969;
    --tick:rgba(255,250,240,.07); --beat:rgba(255,250,240,.04); --edge:#3a3443; --pm:#e2b45c; --on-acc:#17141b;
    --t0:#f0705a; --t1:#eaa53a; --t2:#4cc2b2; --t3:#a897ff; --danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a171e; --surface:#231f29; --raised:#2f2a37; --ink:#ece6da; --dim:#9b94a5; --line:#5f5969;
  --tick:rgba(255,250,240,.07); --beat:rgba(255,250,240,.04); --edge:#3a3443; --pm:#e2b45c; --on-acc:#17141b;
  --t0:#f0705a; --t1:#eaa53a; --t2:#4cc2b2; --t3:#a897ff; --danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--ui);
  display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}

/* top */
#top{display:flex;align-items:center;gap:6px;padding:6px 8px 4px 12px;flex:none}
#titleB{flex:1;min-width:0;text-align:left;font:700 22px/1.1 var(--cond);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
#titleB small{font:500 13px var(--ui);color:var(--dim);margin-left:8px}
.ib{min-width:42px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--edge);font:600 15px var(--cond);padding:0 10px}
.ib:disabled{opacity:.35}
#tabs{display:flex;gap:6px;padding:2px 8px 8px 12px;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1.5px solid var(--edge);font:600 15px var(--cond);color:var(--dim);white-space:nowrap}
.tab::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.tab.on{border-color:var(--c);color:var(--ink);background:var(--surface)}
.tab.muted{text-decoration:line-through}

/* score */
#score{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 28px 8px;
  display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px 10px}
.bar{width:min(100%,calc(var(--steps)*26px + var(--gut)));border-radius:8px;padding:0 0 3px}
.bar-head{display:flex;align-items:center;gap:8px;height:24px;padding-left:var(--gut)}
.bar-btn{font:600 14px var(--cond);color:var(--dim);height:24px;padding:0 10px 0 0;min-width:48px;text-align:left}
.bar-btn span{letter-spacing:1px;opacity:.6;margin-left:4px}
.bar.current .bar-btn{color:var(--acc)}
.sig{font:700 13px var(--cond);color:var(--ink)}
.gl{font:500 12px var(--cond);color:var(--dim)}
.tp{font:600 12px var(--cond);color:var(--pm)}
.bar.wide{overflow-x:auto}
.bar.wide .bar-body{min-width:calc(var(--steps)*13px + var(--gut))}
.bar.wide .pmrow{min-width:calc(var(--steps)*13px)}
.lp{margin-left:auto;font:600 11px var(--cond);color:var(--on-acc);background:var(--acc);border-radius:3px;padding:0 5px;margin-right:2px}
.bar-body{display:flex}
.gutter{width:var(--gut);flex:none}
.gutter span{display:block;height:var(--rh);font:600 11px/var(--rh) var(--cond);color:var(--dim);text-align:center}
.grid{position:relative;flex:1;min-width:0;height:calc(var(--rows)*var(--rh));border-left:2px solid var(--ink);border-right:1px solid var(--line);
  background:
   linear-gradient(to right,var(--tick) 1px,transparent 1px) 0 0/calc(100%/var(--steps)) 100%,
   linear-gradient(to bottom,transparent calc(var(--rh)/2 - .5px),var(--line) calc(var(--rh)/2 - .5px),var(--line) calc(var(--rh)/2 + .5px),transparent calc(var(--rh)/2 + .5px)) 0 0/100% var(--rh);
  cursor:pointer}
.beat{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none}
.beat.alt{background:var(--beat)}
.n{position:absolute;width:calc(100%/var(--steps));height:var(--rh);text-align:center;font:600 16px/var(--rh) var(--cond);pointer-events:none;white-space:nowrap}
.n b{font-weight:600;background:var(--bg);padding:0 1px;border-radius:2px}
.n.pm b{color:var(--pm)}
.n i{position:absolute;top:-5px;left:calc(50% + 4px);font:700 10px/1 var(--cond);font-style:normal;color:var(--acc)}
.n.d b{background:none;display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ink);vertical-align:-1px;padding:0}
.n.d.v3 b{width:14px;height:14px;background:var(--acc);vertical-align:-2px}
.n.d.v1 b{width:8px;height:8px;background:var(--bg);border:1.5px solid var(--dim);vertical-align:0}
.n.d.cym b{background:var(--bg);width:auto;height:auto;border:0;border-radius:2px;font:700 17px/1 var(--cond);vertical-align:0;padding:0 1px}
.n.d.cym.v3 b{color:var(--acc);font-size:21px}
.n.d.cym.v1 b{color:var(--dim);font-size:13px}
.rest{position:absolute;top:3px;bottom:3px;width:calc(100%/var(--steps));pointer-events:none}
.rest::after{content:"";position:absolute;left:calc(50% - 1.5px);top:0;bottom:0;width:3px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--dim) 0 4px,transparent 4px 7px)}
.cursor{position:absolute;width:calc(100%/var(--steps));height:var(--rh);border:2px solid var(--acc);border-radius:5px;pointer-events:none;
  background:color-mix(in srgb,var(--acc) 16%,transparent)}
.curcol{position:absolute;top:0;bottom:0;width:calc(100%/var(--steps));background:color-mix(in srgb,var(--acc) 9%,transparent);pointer-events:none}
.playhead{position:absolute;top:-2px;bottom:-2px;width:calc(100%/var(--steps));background:color-mix(in srgb,var(--ink) 16%,transparent);border-left:2px solid var(--ink);pointer-events:none}
.pmrow{position:relative;height:8px;margin-left:var(--gut)}
.pmrow u{position:absolute;top:2px;height:4px;width:calc(100%/var(--steps) - 3px);margin-left:1.5px;border-radius:2px;background:var(--pm);opacity:.8}
.pmrow em{position:absolute;left:calc(-1*var(--gut));top:-2px;width:var(--gut);text-align:center;font:600 9px var(--cond);font-style:normal;color:var(--pm)}
#addbar{width:100%;height:46px;border:1.5px dashed var(--edge);border-radius:10px;color:var(--dim);font:600 15px var(--cond);margin-top:6px}

/* bottom */
#bottom{flex:none;background:var(--surface);border-top:1px solid var(--edge);padding:6px 6px 6px}
#transport{display:flex;align-items:center;gap:6px}
#play{height:42px;min-width:96px;border-radius:10px;background:var(--acc);color:var(--on-acc);font:700 16px var(--cond);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
#play svg{width:13px;height:13px;fill:currentColor}
.tg{height:42px;padding:0 11px;border-radius:10px;border:1.5px solid var(--edge);font:600 14px var(--cond);color:var(--dim);white-space:nowrap}
.tg.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,transparent)}
#pos{flex:1;text-align:center;font:500 13px var(--cond);color:var(--dim);white-space:nowrap;overflow:hidden}
#pad{display:grid;gap:5px;margin-top:6px}
#pad[hidden]{display:none}
.row{display:grid;gap:5px;grid-auto-flow:column;grid-auto-columns:1fr}
.k{height:42px;border-radius:9px;background:var(--raised);border:1px solid var(--edge);border-bottom-width:2.5px;font:600 17px var(--cond);display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;white-space:nowrap}
.k:active{transform:translateY(1px);border-bottom-width:1px;background:var(--bg)}
.k.s{font-size:14px;color:var(--dim);background:var(--surface)}
.k.num{font-size:21px;height:46px}
.k.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.k.pmk.on{background:var(--pm);color:var(--bg)}
.k svg{width:12px;height:12px;fill:currentColor}
.k small{font:500 11px var(--cond);opacity:.75}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 250px);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:18px;font:500 14px var(--ui);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:.96}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,8,14,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#card{width:min(100%,560px);max-height:86%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#card h2{font:700 22px var(--cond);margin:2px 0 10px;display:flex;align-items:center}
#card h2 button{margin-left:auto;font:600 15px var(--cond);color:var(--dim);height:36px;padding:0 10px;border:1px solid var(--edge);border-radius:9px}
#card h3{font:600 14px var(--ui);color:var(--dim);margin:16px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.b{min-height:42px;padding:6px 13px;border-radius:10px;background:var(--raised);border:1px solid var(--edge);font:600 15px var(--cond);text-align:left}
.b.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.b.warn{color:var(--danger)}
.b.wide{flex:1 1 100%}
.b small{display:block;font:400 12px var(--ui);color:var(--dim)}
.b.on small{color:inherit;opacity:.8}
.fld{display:flex;align-items:center;gap:8px;margin:6px 0}
.fld>span{flex:none;width:74px;font-size:13px;color:var(--dim)}
.fld input[type=text],.fld input[type=number],.fld select,textarea{flex:1;min-width:0;height:42px;border-radius:9px;border:1px solid var(--edge);background:var(--raised);padding:0 10px;font-size:16px}
.fld input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:32px}
.fld input[type=number]{flex:0 0 84px;text-align:center;font:700 20px var(--cond)}
textarea{width:100%;height:160px;padding:10px;font:12px/1.25 ui-monospace,Menlo,Consolas,monospace;white-space:pre;resize:vertical}
.trk{border-left:4px solid var(--c);padding:2px 0 8px 10px;margin:0 0 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.songrow{display:flex;gap:6px;margin-bottom:6px}
.who{display:flex;align-items:center;gap:6px;margin:6px 0}
.who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.fld input[type=email]{flex:1;min-width:0;height:42px;border-radius:9px;border:1px solid var(--edge);background:var(--raised);padding:0 10px;font-size:16px}
.songrow .b{flex:1;min-width:0}
.note{font-size:13px;color:var(--dim);margin:8px 0 0}
#recbox{border:1.5px solid var(--edge);border-radius:12px;padding:12px;margin:10px 0;text-align:center}
#recbox.count{border-color:var(--pm)}
#recbox.rec{border-color:var(--danger)}
#recbox.flash{background:color-mix(in srgb,var(--acc) 22%,transparent)}
#recmsg{font:700 22px var(--cond);min-height:30px}
#recbox.idle #recmsg{font:500 14px var(--ui);color:var(--dim)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.padb{height:96px;border-radius:12px;background:var(--raised);border:1px solid var(--edge);border-bottom-width:3px;font:700 20px var(--cond);touch-action:none}
.padb:active{background:var(--acc);color:var(--on-acc)}
.padb small{display:block;font:400 12px var(--ui);color:var(--dim)}
.padb:active small{color:inherit}
label.b{display:inline-flex;align-items:center;cursor:pointer}
@media (max-width:460px){#pos{display:none}#transport .tg{flex:1;padding:0 6px}}
.ro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--dim);padding:8px 4px 4px}
.ro b{color:var(--ink);font-weight:600}
.kbd{display:none}
.tag{font:600 12px var(--cond);border:1px solid var(--edge);border-radius:4px;padding:0 5px;margin-left:8px;color:var(--dim);vertical-align:2px}
@media (min-width:700px){ :root{--rh:24px} }
@media (min-width:700px) and (max-width:979px){ #bottom{padding:8px max(8px,calc(50% - 330px))} }
@media (min-width:980px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:auto auto minmax(0,1fr)}
  #top{grid-column:1/-1;padding:10px 16px 6px 20px} #tabs{grid-column:1/-1;padding-left:20px}
  #score{grid-column:1;grid-row:3;padding:8px 20px 40px;gap:14px 18px}
  .bar{width:min(100%,calc(var(--steps)*24px + var(--gut)))}
  #bottom{grid-column:2;grid-row:3;border-top:0;border-left:1px solid var(--edge);padding:14px;overflow-y:auto}
  #transport{flex-wrap:wrap} #play{flex:1 1 100%}
  #pos{display:block;order:9;flex:1 1 100%;text-align:left;padding:4px 2px}
  #padB{display:none} #pad{margin-top:10px}
  #sheet{align-items:center} #card{border-radius:18px;max-height:90%}
  #toast{bottom:28px}
  .kbd{display:block}
}
@media (max-height:520px){ .k{height:34px} .k.num{height:36px} #top{padding-top:2px} #titleB{padding:3px 0} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<header id="top">
  <button id="titleB" data-act="song" aria-label="Song settings"></button>
  <button class="ib" data-act="mixer">Mix</button>
  <button class="ib" id="undoB" data-act="undo" aria-label="Undo">↶</button>
  <button class="ib" id="redoB" data-act="redo" aria-label="Redo">↷</button>
</header>
<nav id="tabs" aria-label="Tracks"></nav>
<main id="score"></main>
<footer id="bottom">
  <div id="transport">
    <button id="play" data-act="play"></button>
    <button class="tg" id="loopB" data-act="loop">Loop</button>
    <button class="tg" id="metroB" data-act="metro">Click</button>
    <button class="tg" data-act="capture">Capture</button>
    <span id="pos"></span>
    <button class="tg" id="padB" data-act="pad">Keys</button>
  </div>
  <div id="pad"></div>
</footer>
<div id="toast" role="status"></div>
<div id="sheet" hidden><div id="card" role="dialog" aria-modal="true"></div></div>

<script src="firebase-config.js"></script>
<script>
'use strict';
/* ================= helpers & constants ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const GTR={
  'E standard':[64,59,55,50,45,40],'Eb standard':[63,58,54,49,44,39],'D standard':[62,57,53,48,43,38],
  'Drop D':[64,59,55,50,45,38],'Drop C#':[63,58,54,49,44,37],'Drop C':[62,57,53,48,43,36],
  'C standard':[60,55,51,46,41,36],'Drop B':[61,56,52,47,42,35],'B standard':[59,54,50,45,40,35],'Drop A':[59,54,50,45,40,33],
  '7-string B standard':[64,59,55,50,45,40,35],'7-string Drop A':[64,59,55,50,45,40,33],'7-string Drop G':[62,57,53,48,43,38,31],
  '8-string F# standard':[64,59,55,50,45,40,35,30],'8-string Drop E':[64,59,55,50,45,40,35,28]};
const BASS={
  'E standard':[43,38,33,28],'Drop D':[43,38,33,26],'D standard':[41,36,31,26],'Drop C':[41,36,31,24],
  'C standard':[39,34,29,24],'Drop B':[40,35,30,23],'5-string B standard':[43,38,33,28,23],'5-string Drop A':[43,38,33,28,21]};
const TONES={
  highgain:{label:'High gain',hp:130,drive:28,lp:4600,level:.2,prog:30},
  crunch:{label:'Crunch',hp:90,drive:5,lp:5200,level:.3,prog:29},
  clean:{label:'Clean',hp:60,drive:.9,lp:6500,level:.9,prog:27},
  bass:{label:'Clean bass',hp:30,drive:2.2,lp:2200,level:.5,prog:34},
  bassdrive:{label:'Dirty bass',hp:40,drive:9,lp:3000,level:.3,prog:34}};
const TONES_FOR={guitar:['highgain','crunch','clean'],bass:['bass','bassdrive']};
const DRUMS=[
  {id:'cr',label:'CR',name:'Crash',midi:49,lv:.5},{id:'ch',label:'CH',name:'China',midi:52,lv:.5},
  {id:'rd',label:'RD',name:'Ride',midi:51,lv:.45},{id:'ho',label:'HO',name:'Open hat',midi:46,lv:.4},
  {id:'hh',label:'HH',name:'Closed hat',midi:42,lv:.4},{id:'t1',label:'T1',name:'High tom',midi:48,lv:.85},
  {id:'t2',label:'T2',name:'Mid tom',midi:45,lv:.85},{id:'ft',label:'FT',name:'Floor tom',midi:41,lv:.9},
  {id:'sn',label:'SN',name:'Snare',midi:38,lv:.9},{id:'kk',label:'KK',name:'Kick',midi:36,lv:1}];
const LANE=id=>DRUMS.findIndex(d=>d.id===id);
const GRIDS={2:'8ths',4:'16ths',8:'32nds',3:'8th triplets',6:'16th triplets',12:'16ths + triplets'};
const TG={h:'h',s:'/',b:'b',v:'~',ph:'◆'};
const stepsOf=b=>b.n*4*b.g/b.d;
const rowsOf=tr=>tr.type==='drums'?DRUMS.length:tr.tuning.length;
const TRI=d=>`<svg viewBox="0 0 12 12" aria-hidden="true"><path d="${{l:'M9.5 1v10L2 6z',r:'M2.5 1v10L10 6z',u:'M1 9.5h10L6 2z',d:'M1 2.5h10L6 10z'}[d]}"/></svg>`;

/* ================= state ================= */
const KEY='chugpad.v1';
const LIB={songs:{},currentId:null};
const S={song:null,ti:0,cur:{bar:0,step:0,str:0},pm:false,chord:0,adv:1,tens:0,vel:2,playing:false,
  loop:{on:false,a:0,b:0},metro:false,speed:1,clip:null,scope:'all',pad:true,undo:[],redo:[],sync:'local'};
const T=()=>S.song.tracks[S.ti];

function newTrack(type,name,nb){
  const t={name,type,vol:.8,pan:0,mute:false,solo:false,bars:[]};
  if(type==='guitar'){t.tun='Drop D';t.tuning=GTR[t.tun].slice();t.tone='highgain';t.ring=false}
  if(type==='bass'){t.tun='Drop D';t.tuning=BASS[t.tun].slice();t.tone='bass';t.ring=false}
  if(type==='drums')t.vol=.9;
  for(let i=0;i<nb;i++)t.bars.push({});
  return t;
}
function blankSong(title,nb=4){
  const s={id:newId(),title,tempo:160,updatedAt:Date.now(),bars:[],tracks:[]};
  for(let i=0;i<nb;i++)s.bars.push({n:4,d:4,g:4});

function ksGet(ti,midi,kind){ // plucked-string buffer (Karplus-Strong), cached per pitch

/* ================= playback ================= */
const P={bar:0,step:0,t:0,timer:0,queue:[],endAt:0,shown:null,raf:0};

  for(const key in c){

function pushUndo(){S.undo.push(strip(S.song));if(S.undo.length>40)S.undo.shift();S.redo.length=0}
function swapHistory(from,to){
  if(!from.length)return;to.push(strip(S.song));
  const s=normalize(JSON.parse(from.pop()));carry(S.song,s);delete s._demo;
  LIB.songs[s.id]=s;S.song=s;dirty();renderAll();
}
function commit(barIdx){dirty();if(barIdx===undefined)renderScore();else renderBar(barIdx);renderTop();renderPad()}
function moveStep(d,grow){
  let {bar,step}=S.cur;const bars=S.song.bars;step+=d;
  while(step<0){if(bar===0){step=0;break}bar--;step+=stepsOf(bars[bar])}
  while(step>=stepsOf(bars[bar])){
    if(bar===bars.length-1){
      if(!grow){step=stepsOf(bars[bar])-1;break}
      insertBar(bar+1,bars[bar]);step-=stepsOf(bars[bar]);bar++;S.cur.bar=bar;S.cur.step=step;renderScore();placeCursor();return;
    }
    step-=stepsOf(bars[bar]);bar++;
  }
  S.cur.bar=bar;S.cur.step=step;placeCursor();
}
function putChord(tr,c,step,str,f,pm,level){ // a note, plus its fifth and octave on the next strings when asked
  const mk=fr=>{const n={f:fr};if(pm)n.pm=1;return n},p=tr.tuning[str]+f;
  delete c[step+'_R'];c[step+'_'+str]=mk(f);
  if(level>=1&&str>=1){const f2=p+7-tr.tuning[str-1];if(f2>=0&&f2<=24)c[step+'_'+(str-1)]=mk(f2)}
  if(level>=2&&str>=2){const f3=p+12-tr.tuning[str-2];if(f3>=0&&f3<=24)c[step+'_'+(str-2)]=mk(f3)}
  return c[step+'_'+str];
}
function enterFret(n){
  const tr=T();if(tr.type==='drums'||!canEdit())return;
  const f=Math.min(24,S.tens*10+n);S.tens=0;
  pushUndo();
  const {bar,step,str}=S.cur,c=tr.bars[bar];
  const cell=putChord(tr,c,step,str,f,S.pm,S.chord);
  preview(cell,str);if(S.chord&&c[step+'_'+(str-1)]&&str>0)preview(c[step+'_'+(str-1)],str-1);
  dirty();renderBar(bar);renderTop();
  if(S.adv)moveStep(S.adv,true);
  renderPad();
}
function toggleDrum(bar,step,lane){
  if(!canEdit()){toast('View only. Make your own copy to change it.');return}
  pushUndo();const c=T().bars[bar],key=step+'_'+lane;
  if(c[key]&&(c[key].v||2)===S.vel)delete c[key];
  else{c[key]={v:S.vel};if(!S.playing&&audio())playDrum(S.ti,lane,A.ctx.currentTime+.005,S.vel)}
  S.cur.bar=bar;commit(bar);
}
function insertBar(at,like){
  const sig={n:like.n,d:like.d,g:like.g};S.song.bars.splice(at,0,sig);
  S.song.tracks.forEach(t=>t.bars.splice(at,0,{}));
}
function setSig(i,n,d,g){
  const bar=S.song.bars[i],og=bar.g,nst=n*4*g/d;
  if(!Number.isInteger(nst)||nst<1)return false;
  S.song.tracks.forEach(t=>{
    const c=t.bars[i],out={},late=[];
    for(const key in c){const p=key.split('_'),x=+p[0]*g/og;if(Number.isInteger(x)){if(x<nst)out[x+'_'+p[1]]=c[key]}else late.push([Math.round(x),p[1],c[key]])}
    late.forEach(([x,k,v])=>{if(x<nst&&!out[x+'_'+k])out[x+'_'+k]=v});
    t.bars[i]=out;
  });
  bar.n=n;bar.d=d;bar.g=g;return true;
}
function copyBar(i){
  const b0=S.song.bars[i],sig={n:b0.n,d:b0.d,g:b0.g};
  S.clip=S.scope==='all'?{all:true,sig,cells:S.song.tracks.map(t=>clone(t.bars[i])),n:S.song.tracks.length}
    :{all:false,sig,cells:clone(T().bars[i]),drums:T().type==='drums',rows:rowsOf(T())};
  toast(S.scope==='all'?`Copied bar ${i+1}, all tracks`:`Copied bar ${i+1} of ${T().name}`);
}
function pasteBar(i){
  const cl=S.clip;if(!cl)return false;
  if(cl.all){
    Object.assign(S.song.bars[i],cl.sig);
    S.song.tracks.forEach((t,k)=>{t.bars[i]=k<cl.cells.length?clone(cl.cells[k]):{}});
  }else{
    const tr=T();if((tr.type==='drums')!==cl.drums){toast('That bar was copied from a different kind of track');return false}
    const bar=S.song.bars[i],st=stepsOf(bar),out={};
    for(const key in cl.cells){const p=key.split('_'),x=+p[0]*bar.g/cl.sig.g;if(Number.isInteger(x)&&x<st&&(p[1]==='R'||+p[1]<rowsOf(tr)))out[x+'_'+p[1]]=clone(cl.cells[key])}
    tr.bars[i]=out;
  }
  return true;
}

  tuning(el){const t=S.song.tracks[+el.dataset.i];if(!(t.type==='bass'?BASS:GTR)[el.value])return;pushUndo();t.tun=el.value;t.tuning=(t.type==='bass'?BASS:GTR)[el.value].slice();dirty();renderAll()},
  tone(el){S.song.tracks[+el.dataset.i].tone=el.value;dirty()},
  ring(el){S.song.tracks[+el.dataset.i].ring=el.checked;dirty()}
};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){if(b.disabled)return;const a=b.dataset.act,f=ACT[a];if(EDITS.has(a)&&!canEdit()){toast('View only. Make your own copy to change it.');return}if(f)f(b.dataset,b);return}
  if(e.target.id==='sheet'){closeSheet();return}
  const g=e.target.closest('.grid');if(!g)return;
  const i=+g.dataset.i,r=g.getBoundingClientRect(),tr=T(),st=stepsOf(S.song.bars[i]),rows=rowsOf(tr);
  const step=clamp(Math.floor((e.clientX-r.left)/r.width*st),0,st-1),row=clamp(Math.floor((e.clientY-r.top)/r.height*rows),0,rows-1);
  if(tr.type==='drums'){toggleDrum(i,step,row);return}
  S.cur={bar:i,step,str:row};S.tens=0;placeCursor(false);renderPad();
  const n=tr.bars[i][step+'_'+row];if(n)preview(n,row);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&!canEdit())return;if(k&&INPUT[k]&&e.target.tagName!=='SELECT'&&e.target.type!=='checkbox')INPUT[k](e.target)});
document.addEventListener('pointerdown',e=>{const p=e.target.closest&&e.target.closest('[data-pad]');if(p){e.preventDefault();recTap(+p.dataset.pad,e)}});
document.addEventListener('change',e=>{if(e.target.id==='gpfile'){const f=e.target.files&&e.target.files[0];e.target.value='';openGpFile(f);return}
  if(e.target.dataset&&e.target.dataset.in&&!canEdit()){toast('View only. Make your own copy to change it.');refreshSheet();return}const k=e.target.dataset&&e.target.dataset.in;if(k&&INPUT[k]&&(e.target.tagName==='SELECT'||e.target.type==='checkbox'))INPUT[k](e.target)});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='Escape'&&sheetKind){closeSheet();return}
  if(sheetKind)return;
  const k=e.key,lk=k.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&lk==='z'){e.preventDefault();if(canEdit())e.shiftKey?ACT.redo():ACT.undo();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k===' '){e.preventDefault();ACT.play();return}
  if(k==='Tab'){e.preventDefault();ACT.track({i:(S.ti+(e.shiftKey?S.song.tracks.length-1:1))%S.song.tracks.length});return}
  if(T().type==='drums')return;
  const mv={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[k];
  if(mv){e.preventDefault();ACT.mv({d:mv});return}
  if(!canEdit())return;
  if(/^[0-9]$/.test(k)){ // a quick 1 or 2 followed by another digit makes a two-digit fret
    const now=performance.now(),le=S.last,n=+k;
    if(le&&now-le.time<600&&(le.f===1||le.f===2)&&le.f*10+n<=24){S.cur={bar:le.bar,step:le.step,str:le.str};S.tens=le.f;enterFret(n);S.undo.pop();S.last=null;renderTop()}
    else{const pos=Object.assign({},S.cur);enterFret(n);S.last=Object.assign(pos,{f:n,time:now})}
    return;
  }
  if(k==='Backspace'||k==='Delete'){e.preventDefault();ACT.del();return}
  const tk={x:'x',h:'h','/':'s',b:'b',v:'v'}[lk];
  if(tk){ACT.tech({t:tk});return}
  if(lk==='r'){ACT.rest();return}
  if(lk==='p')ACT.pm();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);saveLocal()}});
window.addEventListener('pagehide',saveLocal);
window.addEventListener('hashchange',openFromLink);

/* ================= boot ================= */
loadLocal();
openSong(LIB.currentId);
connect();
</script>
</body>
</html>
